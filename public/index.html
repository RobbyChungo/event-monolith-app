<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Event Monolith</title>
    <style>
      body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;margin:0;padding:24px;background:#0b0d10;color:#e8edf2}
      h1{margin-top:0}
      .card{background:#12151a;border:1px solid #1c222b;border-radius:8px;padding:16px;margin-bottom:16px}
      input,button,select{background:#0f1318;color:#e8edf2;border:1px solid #273040;border-radius:6px;padding:8px}
      button{cursor:pointer}
      .row{display:flex;gap:8px;flex-wrap:wrap}
      .muted{color:#92a2b4}
      .list{display:grid;gap:8px}
      .pill{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid #273040}
      .ok{color:#61d095}
      .warn{color:#ffcc66}
      .err{color:#ff7a7a}
      code{background:#0f1318;border:1px solid #273040;border-radius:4px;padding:2px 6px}
    </style>
  </head>
  <body>
    <h1>Event Monolith</h1>

    <div class="card">
      <h3>Auth</h3>
      <div class="row">
        <input id="email" placeholder="email" />
        <input id="password" type="password" placeholder="password" />
        <button id="signup">Signup</button>
        <button id="login">Login</button>
        <span class="muted">Token: <code id="tokenPreview">none</code></span>
      </div>
    </div>

    <div class="card">
      <h3>AI Suggest</h3>
      <div class="row">
        <input id="topic" placeholder="topic e.g. health" />
        <button id="aiSuggest">Suggest</button>
      </div>
      <div id="aiOut" class="muted"></div>
    </div>

    <div class="card">
      <h3>Events</h3>
      <div class="row">
        <button id="loadEvents">Load Approved Events</button>
      </div>
      <div id="events" class="list"></div>
    </div>

    <div class="card">
      <h3>Realtime</h3>
      <div class="muted">Listening to <span class="pill">rsvps</span> and <span class="pill">events</span> channels</div>
      <div id="wsLog" class="list" style="margin-top:8px"></div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js" integrity="sha384-bjF7w3w2tHqQh1YQjzJ+5Cq1W2Q1m1m1S4m0oQm4y0C4vG6c5fW2" crossorigin="anonymous"></script>
    <script src="/app.js"></script>
  </body>
  </html>
