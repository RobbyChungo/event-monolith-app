<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Event Monolith — React</title>
    <style>
      body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;margin:0;padding:24px;background:#0b0d10;color:#e8edf2}
      .card{background:#12151a;border:1px solid #1c222b;border-radius:8px;padding:16px;margin-bottom:16px}
      input,button,select{background:#0f1318;color:#e8edf2;border:1px solid #273040;border-radius:6px;padding:8px}
      button{cursor:pointer}
      .row{display:flex;gap:8px;flex-wrap:wrap}
      .muted{color:#92a2b4}
      .list{display:grid;gap:8px}
      .pill{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid #273040}
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js" crossorigin="anonymous"></script>
    <script type="text/babel" data-type="module" src="/react-app.js"></script>
  </body>
  </html>
